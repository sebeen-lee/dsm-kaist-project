<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메모장</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>메모장</h1>
        <button id="btn-new" title="새 메모">+</button>
      </div>
      <input id="search" type="text" placeholder="메모 검색..." />
      <ul id="memo-list"></ul>
    </aside>

    <main class="editor">
      <div class="editor-toolbar">
        <span id="memo-date"></span>
        <button id="btn-delete" title="삭제" disabled>삭제</button>
      </div>
      <input id="memo-title" type="text" placeholder="제목" maxlength="100" disabled />
      <textarea id="memo-content" placeholder="내용을 입력하세요..." disabled></textarea>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
